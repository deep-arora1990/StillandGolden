# Runs the tests and the site build on every push and pull request. The check
# run is named `checks`; the Website tab reads it as its gate. Netlify still
# deploys main regardless of this result.
name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: node build.js
