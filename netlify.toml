[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.JPG"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/book-mini"
  to = "/"
  status = 301

# Internal documentation was previously committed to the repo root, which is
# also the web root, so it was served publicly and indexable. It is now kept
# out of the repo. 410 rather than 404 tells search engines the URL is
# permanently gone so it gets dropped from the index.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/DEVELOPMENT.md"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/PROJECT-HANDOFF.md"
  to = "/404.html"
  status = 410
  force = true

# Session pages renamed to tier + keyword (25 Jul 2026). Permanent redirects
# preserve the search rankings and any links already pointing at the old URLs.
# Targets point straight at the extensionless canonical URL so no redirect
# chain runs through a .html URL (see URL consolidation redirects below).
[[redirects]]
  from = "/mini-sessions.html"
  to = "/glimpse-mini-sessions"
  status = 301
  force = true

[[redirects]]
  from = "/mini-sessions"
  to = "/glimpse-mini-sessions"
  status = 301
  force = true

[[redirects]]
  from = "/family-photography.html"
  to = "/golden-family-photography"
  status = 301
  force = true

[[redirects]]
  from = "/family-photography"
  to = "/golden-family-photography"
  status = 301
  force = true

[[redirects]]
  from = "/cake-smash-photography.html"
  to = "/golden-cake-smash-photography"
  status = 301
  force = true

[[redirects]]
  from = "/cake-smash-photography"
  to = "/golden-cake-smash-photography"
  status = 301
  force = true

[[redirects]]
  from = "/newborn-photography.html"
  to = "/gathered-newborn-photography"
  status = 301
  force = true

[[redirects]]
  from = "/newborn-photography"
  to = "/gathered-newborn-photography"
  status = 301
  force = true

# URL consolidation for SEO (3 Aug 2026): the site standardised on
# extensionless URLs. Canonical tags, internal links and the sitemap all use
# the extensionless form, but Netlify also serves each page at its .html path
# with a 200 — duplicate content. Force a 301 from every .html URL to the
# canonical extensionless URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

