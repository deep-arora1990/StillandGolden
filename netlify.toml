[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.JPG"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/book-mini"
  to = "/"
  status = 301

# Internal documentation was previously committed to the repo root, which is
# also the web root, so it was served publicly and indexable. It is now kept
# out of the repo. 410 rather than 404 tells search engines the URL is
# permanently gone so it gets dropped from the index.
[[redirects]]
  from = "/DEVELOPMENT.md"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/PROJECT-HANDOFF.md"
  to = "/404.html"
  status = 410
  force = true

# Session pages renamed to tier + keyword (25 Jul 2026). Permanent redirects
# preserve the search rankings and any links already pointing at the old URLs.
[[redirects]]
  from = "/mini-sessions.html"
  to = "/glimpse-mini-sessions.html"
  status = 301
  force = true

[[redirects]]
  from = "/mini-sessions"
  to = "/glimpse-mini-sessions.html"
  status = 301
  force = true

[[redirects]]
  from = "/family-photography.html"
  to = "/golden-family-photography.html"
  status = 301
  force = true

[[redirects]]
  from = "/family-photography"
  to = "/golden-family-photography.html"
  status = 301
  force = true

[[redirects]]
  from = "/cake-smash-photography.html"
  to = "/golden-cake-smash-photography.html"
  status = 301
  force = true

[[redirects]]
  from = "/cake-smash-photography"
  to = "/golden-cake-smash-photography.html"
  status = 301
  force = true

[[redirects]]
  from = "/newborn-photography.html"
